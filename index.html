<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTn</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  .rec-dot { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .rec-dot { animation: none; } }
</style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex items-center justify-center p-4">
  <div class="max-w-xl w-full bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col gap-6">

    <header class="flex items-center justify-between border-b border-slate-200 pb-4">
      <div class="flex items-center gap-3">
        <img src="icon.svg" alt="Logo" class="w-10 h-10 object-contain drop-shadow-sm">
        <h1 class="text-xl font-semibold">G</h1>
      </div>
      <div class="flex items-center gap-2 text-sm text-slate-600 font-medium bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200">
        <span id="dot" class="inline-block w-2.5 h-2.5 rounded-full bg-slate-300"></span>
        <span id="statusText">Ch</span>
      </div>
    </header>

    <div class="flex flex-wrap items-center gap-3">
      <button id="btnStart" type="button"
        class="flex-1 min-w-[120px] px-6 py-3.5 text-lg font-semibold rounded-xl bg-emerald-600 text-white shadow hover:bg-emerald-700 focus-visible:outline focus-visible:outline-4 focus-visible:outline-emerald-300 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
        B
      </button>
      <button id="btnStop" type="button" disabled
        class="flex-1 min-w-[120px] px-6 py-3.5 text-lg font-semibold rounded-xl bg-rose-600 text-white shadow hover:bg-rose-700 focus-visible:outline focus-visible:outline-4 focus-visible:outline-rose-300 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
        D
      </button>
    </div>

    <!-- MỚI: chế độ thu âm thanh máy -->
    <label class="flex items-start gap-3 text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 cursor-pointer">
      <input id="chkSystemAudio" type="checkbox" class="mt-0.5 w-4 h-4 accent-emerald-600">
      <span>
        <span class="font-medium">Thu cả âm thanh máy (học Meet)</span><br>
        <span class="text-xs text-slate-500">Khi bấm bắt đầu, chọn tab Meet và tick "Chia sẻ âm thanh tab". Dùng Chrome/Edge trên máy tính.</span>
      </span>
    </label>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <button id="btnExport" type="button" disabled
        class="px-5 py-3 font-medium rounded-xl bg-white border border-slate-300 hover:border-slate-900 focus-visible:outline focus-visible:outline-4 focus-visible:outline-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
        X (.t)
      </button>
      <button id="btnExportAudio" type="button" disabled
        class="px-5 py-3 font-medium rounded-xl bg-white border border-slate-300 hover:border-slate-900 focus-visible:outline focus-visible:outline-4 focus-visible:outline-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
        X(.w)
      </button>
    </div>

    <button id="btnClear" type="button" disabled
      class="w-full px-5 py-3 font-medium rounded-xl bg-white border border-slate-300 text-rose-700 hover:border-rose-700 hover:bg-rose-50 focus-visible:outline focus-visible:outline-4 focus-visible:outline-rose-200 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
      Xu
    </button>

    <p id="note" class="text-sm text-center text-slate-600 min-h-[1.25rem]"></p>
  </div>

<script>
(function () {
  const STORAGE_KEY = 'baigiang_transcript_v2';
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  const $ = (id) => document.getElementById(id);
  const btnStart = $('btnStart'), btnStop = $('btnStop'),
        btnExport = $('btnExport'), btnExportAudio = $('btnExportAudio'), btnClear = $('btnClear');
  const dot = $('dot'), statusText = $('statusText'), note = $('note');
  const chkSystemAudio = $('chkSystemAudio');

  let finals = [];            
  let currentInterim = '';    
  let wantListening = false;  
  let globalStartTime = 0;
  let quickFails = 0;
  let restartTimer = null;
  let wakeLock = null;

  let mediaRecorder = null;
  let audioChunks = [];
  let audioBlobUrl = null;

  // MỚI: các luồng âm thanh để dọn dẹp khi dừng
  let micStream = null;
  let displayStream = null;
  let audioCtx = null;

  /* ---------- Tiện ích UI & Thời gian ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  
  function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return '[' + pad(h) + ':' + pad(m) + ':' + pad(s) + '] ';
    return '[' + pad(m) + ':' + pad(s) + '] ';
  }

  function setStatus(text, mode) {
    statusText.textContent = text;
    const base = 'inline-block w-2.5 h-2.5 rounded-full ';
    dot.className = base + (mode === 'live' ? 'bg-rose-600 rec-dot'
                          : mode === 'retry' ? 'bg-amber-500'
                          : 'bg-slate-300');
  }
  function setNote(text, isErr) {
    note.textContent = text || '';
    note.className = 'text-sm font-medium text-center min-h-[1.25rem] ' + (isErr ? 'text-rose-600' : 'text-slate-600');
  }
  function updateButtons() {
    const hasText = finals.length > 0 || !!currentInterim.trim();
    btnExport.disabled = !hasText;
    btnClear.disabled = !hasText && !audioBlobUrl;
  }

  /* ---------- Lưu trữ (auto-save text ngầm) ---------- */
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(finals)); }
    catch (e) { setNote('Không lưu được vào bộ nhớ.', true); }
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter((s) => typeof s === 'string' && s.trim()) : [];
    } catch (e) { return []; }
  }

  /* ---------- Xử lý dữ liệu văn bản ngầm ---------- */
  function addFinal(text) {
    text = (text || '').trim();
    if (!text) return;
    
    let elapsed = globalStartTime > 0 ? Date.now() - globalStartTime : 0;
    const stampedText = formatTime(elapsed) + text;

    finals.push(stampedText);
    save();                         
    updateButtons();
  }

  function commitInterim() {
    const left = currentInterim.trim();
    currentInterim = '';
    if (left) addFinal(left);
  }

  /* ---------- MỚI: dọn các luồng âm thanh ---------- */
  function cleanupStreams() {
    [micStream, displayStream].forEach(function (s) {
      if (s) s.getTracks().forEach(function (t) { try { t.stop(); } catch (e) {} });
    });
    micStream = null;
    displayStream = null;
    if (audioCtx) { try { audioCtx.close(); } catch (e) {} audioCtx = null; }
  }

  /* ---------- Khôi phục dữ liệu ---------- */
  finals = load();
  updateButtons();
  if (finals.length) setNote('Đã khôi phục dữ liệu cũ trong bộ nhớ.');

  /* ---------- Nhận diện giọng nói & Ghi âm Audio ---------- */
  if (!SR) {
    btnStart.disabled = true;
    setNote('Trình duyệt này không hỗ trợ nhận diện giọng nói. Hãy mở bằng Google Chrome.', true);
  } else {
    const recognition = new SR();
    recognition.lang = 'vi-VN';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = function () {
      setStatus('…', 'live');
    };

    recognition.onresult = function (event) {
      quickFails = 0;
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const res = event.results[i];
        if (res.isFinal) addFinal(res[0].transcript);
        else interim += res[0].transcript;
      }
      currentInterim = interim;
      updateButtons();
    };

    recognition.onerror = function (event) {
      switch (event.error) {
        case 'no-speech':
        case 'aborted': break; 
        case 'not-allowed':
        case 'service-not-allowed':
          wantListening = false;
          setNote('Chưa cấp quyền micro.', true);
          break;
        case 'audio-capture':
          wantListening = false;
          setNote('Không tìm thấy micro.', true);
          break;
        case 'network':
          quickFails = Math.max(quickFails, 3);
          setNote('Mất mạng, đang thử kết nối lại...', true);
          break;
      }
    };

    recognition.onend = function () {
      commitInterim(); 
      if (!wantListening) {
        setStatus('Đãg', '');
        btnStart.disabled = false;
        btnStop.disabled = true;
        releaseWakeLock();
        return;
      }
      quickFails++;
      const delay = quickFails === 0 ? 0 : Math.min(5000, 300 * quickFails);
      setStatus(quickFails > 1 ? 'Đang kết nối lại…' : 'Đ…', quickFails > 1 ? 'retry' : 'live');
      scheduleStart(delay);
    };

    function scheduleStart(delay) {
      clearTimeout(restartTimer);
      restartTimer = setTimeout(safeStart, delay);
    }
    function safeStart() {
      if (!wantListening) return;
      try { recognition.start(); }
      catch (e) { scheduleStart(300); } 
    }

    btnStart.addEventListener('click', async function () {
      if (wantListening) return;
      wantListening = true;
      globalStartTime = Date.now();
      quickFails = 0;
      setNote('');
      btnStart.disabled = true;
      btnStop.disabled = false;
      requestWakeLock();
      
      try {
        let noteAfter = '';

        // MỚI: xin chia sẻ tab/màn hình (phải gọi trước, ngay trong lúc bấm nút)
        if (chkSystemAudio.checked) {
          if (!navigator.mediaDevices.getDisplayMedia) {
            throw new Error('Trình duyệt không hỗ trợ thu âm thanh máy.');
          }
          displayStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
          if (displayStream.getAudioTracks().length === 0) {
            displayStream.getTracks().forEach(function (t) { t.stop(); });
            displayStream = null;
            noteAfter = 'Không có âm thanh máy (quên tick "Chia sẻ âm thanh tab"?). Đang chỉ thu micro.';
          } else {
            // Nếu bấm "Dừng chia sẻ" trên thanh Chrome thì chỉ báo, micro vẫn chạy
            displayStream.getAudioTracks()[0].addEventListener('ended', function () {
              if (wantListening) setNote('Đã dừng chia sẻ âm thanh máy, vẫn đang thu micro.', true);
            });
          }
        }

        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];

        // Luồng để ghi: nếu có âm thanh máy thì trộn micro + âm thanh máy
        let recordStream = micStream;
        if (displayStream) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const dest = audioCtx.createMediaStreamDestination();
          audioCtx.createMediaStreamSource(micStream).connect(dest);
          audioCtx.createMediaStreamSource(new MediaStream(displayStream.getAudioTracks())).connect(dest);
          recordStream = dest.stream;
        }
        
        mediaRecorder = new MediaRecorder(recordStream);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          if (audioBlobUrl) URL.revokeObjectURL(audioBlobUrl);
          audioBlobUrl = URL.createObjectURL(blob);
          btnExportAudio.disabled = false;
          btnClear.disabled = false;
          setNote('Đã hoàn tất ghi ngầm âm thanh và văn bản. Bạn có thể tải về!');
        };
        
        mediaRecorder.start(1000);
        if (noteAfter) setNote(noteAfter, true);
        safeStart();
      } catch (err) {
        wantListening = false;
        cleanupStreams();
        btnStart.disabled = false;
        btnStop.disabled = true;
        setNote('Lỗi quyền Micro: ' + err.message, true);
      }
    });

    btnStop.addEventListener('click', function () {
      wantListening = false;
      clearTimeout(restartTimer);
      btnStop.disabled = true;
      
      try { recognition.stop(); } catch (e) {}
      
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder = null;
      }
      cleanupStreams();

      setTimeout(function () {
        if (!wantListening && btnStart.disabled) {
          commitInterim();
          setStatus('Đã dừng', '');
          btnStart.disabled = false;
          releaseWakeLock();
        }
      }, 1500);
    });
  }

  /* ---------- Giữ máy không ngủ ---------- */
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', function () { wakeLock = null; });
      }
    } catch (e) { }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && wantListening) requestWakeLock();
  });

  /* ---------- Xuất file TXT & Audio ---------- */
  function buildFileName(ext) {
    const d = new Date();
    return 'B_' + pad(d.getDate()) + '-' + pad(d.getMonth() + 1) + '-' + d.getFullYear() +
           '_' + pad(d.getHours()) + 'h' + pad(d.getMinutes()) + ext;
  }
  
  btnExport.addEventListener('click', function () {
    const lines = finals.slice();
    if (currentInterim.trim()) lines.push(currentInterim.trim());
    if (!lines.length) return;

    const content = '\uFEFF' + lines.join('\r\n');
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = buildFileName('.txt');
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  btnExportAudio.addEventListener('click', function () {
    if (!audioBlobUrl) return;
    const a = document.createElement('a');
    a.href = audioBlobUrl;
    a.download = buildFileName('.webm');
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  /* ---------- Xóa dữ liệu cũ ---------- */
  btnClear.addEventListener('click', function () {
    if (!confirm('Xóa ')) return;
    finals = [];
    currentInterim = '';
    globalStartTime = 0;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    
    if (audioBlobUrl) {
      URL.revokeObjectURL(audioBlobUrl);
      audioBlobUrl = null;
      btnExportAudio.disabled = true;
    }
    
    setNote('Đã xóa dữ liệu.');
    updateButtons();
  });

  window.addEventListener('pagehide', function () {
    const left = currentInterim.trim();
    if (left) { finals.push(left); save(); }
  });
})();
</script>
</body>
</html>
