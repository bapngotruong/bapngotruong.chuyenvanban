<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BTn</title>
<link rel="icon" type="image/svg+xml" href="icon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  #transcript { scroll-behavior: smooth; }
  #transcript .final { color: #111827; font-weight: 500; }
  #transcript .interim { color: #9ca3af; }
  .rec-dot { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  @media (prefers-reduced-motion: reduce) { .rec-dot { animation: none; } }
</style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
  <div class="max-w-5xl mx-auto px-4 py-6 flex flex-col gap-4 h-screen">

    <header class="flex items-center justify-between flex-wrap gap-2 border-b border-slate-200 pb-4">
      <div class="flex items-center gap-3">
        <img src="icon.svg" alt="Logo" class="w-10 h-10 object-contain drop-shadow-sm">
        <h1 class="text-xl font-semibold">n</h1>
      </div>
      <div class="flex items-center gap-2 text-sm text-slate-600 font-medium bg-white px-3 py-1.5 rounded-full shadow-sm border border-slate-200">
        <span id="dot" class="inline-block w-2.5 h-2.5 rounded-full bg-slate-300"></span>
        <span id="statusText">Chưa </span>
      </div>
    </header>

    <div class="flex flex-wrap items-center gap-3">
      <button id="btnStart" type="button"
        class="px-8 py-3.5 text-lg font-semibold rounded-xl bg-emerald-600 text-white shadow hover:bg-emerald-700 focus-visible:outline focus-visible:outline-4 focus-visible:outline-emerald-300 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
        Bắt 
      </button>
      <button id="btnStop" type="button" disabled
        class="px-5 py-3 font-medium rounded-xl bg-rose-600 text-white shadow hover:bg-rose-700 focus-visible:outline focus-visible:outline-4 focus-visible:outline-rose-300 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
        Dừng
      </button>
      <button id="btnExport" type="button" disabled
        class="px-5 py-3 font-medium rounded-xl bg-white border border-slate-300 hover:border-slate-900 focus-visible:outline focus-visible:outline-4 focus-visible:outline-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
         file Chữ (.txt)
      </button>
      <button id="btnExportAudio" type="button" disabled
        class="px-5 py-3 font-medium rounded-xl bg-white border border-slate-300 hover:border-slate-900 focus-visible:outline focus-visible:outline-4 focus-visible:outline-slate-300 disabled:opacity-40 disabled:cursor-not-allowed transition-all">
         file Âm thanh (.webm)
      </button>
      <button id="btnClear" type="button" disabled
        class="px-5 py-3 font-medium rounded-xl bg-white border border-slate-300 text-rose-700 hover:border-rose-700 hover:bg-rose-50 focus-visible:outline focus-visible:outline-4 focus-visible:outline-rose-200 disabled:opacity-40 disabled:cursor-not-allowed sm:ml-auto transition-all">
        Xóa dữ liệu
      </button>
    </div>

    <div id="transcript" role="textbox" aria-readonly="true" aria-live="polite" aria-label="Văn bản ghi âm"
      class="flex-1 min-h-[320px] overflow-y-auto bg-white shadow-sm border border-slate-200 rounded-2xl p-6 text-lg leading-8"></div>

    <p id="note" class="text-sm text-slate-600 min-h-[1.25rem]"></p>
  </div>

<script>
(function () {
  const STORAGE_KEY = 'baigiang_transcript_v2';
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  const $ = (id) => document.getElementById(id);
  const btnStart = $('btnStart'), btnStop = $('btnStop'),
        btnExport = $('btnExport'), btnExportAudio = $('btnExportAudio'), btnClear = $('btnClear');
  const box = $('transcript'), dot = $('dot'),
        statusText = $('statusText'), note = $('note');

  let finals = [];            
  let interimEl = null;       
  let wantListening = false;  
  let globalStartTime = 0; // Mốc thời gian bắt đầu file webm
  let quickFails = 0;
  let restartTimer = null;
  let wakeLock = null;

  let mediaRecorder = null;
  let audioChunks = [];
  let audioBlobUrl = null;

  /* ---------- Tiện ích UI & Thời gian ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  
  function formatTime(ms) {
    const totalSec = Math.floor(ms / 1000);
    const h = Math.floor(totalSec / 3600);
    const m = Math.floor((totalSec % 3600) / 60);
    const s = totalSec % 60;
    if (h > 0) return '[' + pad(h) + ':' + pad(m) + ':' + pad(s) + '] ';
    return '[' + pad(m) + ':' + pad(s) + '] ';
  }

  function setStatus(text, mode) {
    statusText.textContent = text;
    const base = 'inline-block w-2.5 h-2.5 rounded-full ';
    dot.className = base + (mode === 'live' ? 'bg-rose-600 rec-dot'
                          : mode === 'retry' ? 'bg-amber-500'
                          : 'bg-slate-300');
  }
  function setNote(text, isErr) {
    note.textContent = text || '';
    note.className = 'text-sm font-medium min-h-[1.25rem] ' + (isErr ? 'text-rose-600' : 'text-slate-600');
  }
  function scrollToBottom() { box.scrollTop = box.scrollHeight; }
  function updateButtons() {
    const hasText = finals.length > 0 || !!interimText();
    btnExport.disabled = !hasText;
    btnClear.disabled = !hasText && !audioBlobUrl;
  }
  function interimText() { return interimEl ? interimEl.textContent : ''; }

  /* ---------- Lưu trữ (auto-save text) ---------- */
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(finals)); }
    catch (e) { setNote('Không lưu được vào bộ nhớ.', true); }
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter((s) => typeof s === 'string' && s.trim()) : [];
    } catch (e) { return []; }
  }

  /* ---------- Hiển thị Text kèm Timestamp ---------- */
  function renderEmptyHint() {
    if (!finals.length && !interimEl && !box.querySelector('.empty')) {
      const p = document.createElement('p');
      p.className = 'empty text-slate-400 italic';
      p.textContent = 'mốc thời gian sẽ hiển thị tại đây...';
      box.appendChild(p);
    }
  }
  function removeEmptyHint() {
    const h = box.querySelector('.empty');
    if (h) h.remove();
  }
  function appendFinalEl(text) {
    removeEmptyHint();
    const p = document.createElement('p');
    p.className = 'final mb-2 max-w-[72ch]';
    p.textContent = text;
    if (interimEl) box.insertBefore(p, interimEl); else box.appendChild(p);
  }
  
  function addFinal(text) {
    text = (text || '').trim();
    if (!text) return;
    
    // Gắn timestamp tính từ globalStartTime
    let elapsed = globalStartTime > 0 ? Date.now() - globalStartTime : 0;
    const stampedText = formatTime(elapsed) + text;

    finals.push(stampedText);
    save();                       
    appendFinalEl(stampedText);
    scrollToBottom();
    updateButtons();
  }
  
  function showInterim(text) {
    text = (text || '').trim();
    if (!text) { clearInterim(); return; }
    removeEmptyHint();
    if (!interimEl) {
      interimEl = document.createElement('p');
      interimEl.className = 'interim mb-2 max-w-[72ch]';
      box.appendChild(interimEl);
    }
    interimEl.textContent = text;
    scrollToBottom();
    updateButtons();
  }
  function clearInterim() {
    if (interimEl) { interimEl.remove(); interimEl = null; }
  }
  function commitInterim() {
    const left = interimText();
    clearInterim();
    if (left) addFinal(left); // addFinal sẽ tự động gắn timestamp cho câu bị ngắt dở
  }

  /* ---------- Khôi phục dữ liệu ---------- */
  finals = load();
  finals.forEach(appendFinalEl);
  renderEmptyHint();
  scrollToBottom();
  updateButtons();
  if (finals.length) setNote('Đã khôi phục dữ liệu cũ có kèm mốc thời gian.');

  /* ---------- Nhận diện giọng nói & Ghi âm Audio ---------- */
  if (!SR) {
    btnStart.disabled = true;
    setNote('Trình duyệt này không hỗ trợ nhận diện giọng nói. Hãy mở bằng Google Chrome.', true);
  } else {
    const recognition = new SR();
    recognition.lang = 'vi-VN';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = function () {
      setStatus('g ch…', 'live');
    };

    recognition.onresult = function (event) {
      quickFails = 0;
      let interim = '';
      for (let i = event.resultIndex; i < event.results.length; i++) {
        const res = event.results[i];
        if (res.isFinal) addFinal(res[0].transcript);
        else interim += res[0].transcript;
      }
      showInterim(interim);
    };

    recognition.onerror = function (event) {
      switch (event.error) {
        case 'no-speech':
        case 'aborted': break; 
        case 'not-allowed':
        case 'service-not-allowed':
          wantListening = false;
          setNote('Chưa cấp quyền micro.', true);
          break;
        case 'audio-capture':
          wantListening = false;
          setNote('Không tìm thấy micro.', true);
          break;
        case 'network':
          quickFails = Math.max(quickFails, 3);
          setNote('Mất mạng, đang thử kết nối lại...', true);
          break;
      }
    };

    recognition.onend = function () {
      commitInterim(); 
      if (!wantListening) {
        setStatus('Đã dừng', '');
        btnStart.disabled = false;
        btnStop.disabled = true;
        releaseWakeLock();
        return;
      }
      quickFails++;
      const delay = quickFails === 0 ? 0 : Math.min(5000, 300 * quickFails);
      setStatus(quickFails > 1 ? 'Đang kết nối lại…' : 'Đang thu âm…', quickFails > 1 ? 'retry' : 'live');
      scheduleStart(delay);
    };

    function scheduleStart(delay) {
      clearTimeout(restartTimer);
      restartTimer = setTimeout(safeStart, delay);
    }
    function safeStart() {
      if (!wantListening) return;
      try { recognition.start(); }
      catch (e) { scheduleStart(300); } 
    }

    btnStart.addEventListener('click', async function () {
      if (wantListening) return;
      wantListening = true;
      globalStartTime = Date.now(); // Chốt mốc 00:00 của audio file
      quickFails = 0;
      setNote('');
      btnStart.disabled = true;
      btnStop.disabled = false;
      requestWakeLock();
      
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];
        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
          const blob = new Blob(audioChunks, { type: 'audio/webm' });
          if (audioBlobUrl) URL.revokeObjectURL(audioBlobUrl);
          audioBlobUrl = URL.createObjectURL(blob);
          btnExportAudio.disabled = false;
          btnClear.disabled = false;
          setNote('Đã đóng gói xong file Âm thanh và Văn bản. Đã có thể tải về!');
        };
        mediaRecorder.start();
        
        safeStart();
      } catch (err) {
        wantListening = false;
        btnStart.disabled = false;
        btnStop.disabled = true;
        setNote('Lỗi quyền Micro: ' + err.message, true);
      }
    });

    btnStop.addEventListener('click', function () {
      wantListening = false;
      clearTimeout(restartTimer);
      btnStop.disabled = true;
      
      try { recognition.stop(); } catch (e) {}
      
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
        mediaRecorder = null;
      }

      setTimeout(function () {
        if (!wantListening && btnStart.disabled) {
          commitInterim();
          setStatus('Đã dừng', '');
          btnStart.disabled = false;
          releaseWakeLock();
        }
      }, 1500);
    });
  }

  /* ---------- Giữ máy không ngủ ---------- */
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', function () { wakeLock = null; });
      }
    } catch (e) { }
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && wantListening) requestWakeLock();
  });

  /* ---------- Xuất file TXT & Audio ---------- */
  function buildFileName(ext) {
    const d = new Date();
    return 'BaiGiang_' + pad(d.getDate()) + '-' + pad(d.getMonth() + 1) + '-' + d.getFullYear() +
           '_' + pad(d.getHours()) + 'h' + pad(d.getMinutes()) + ext;
  }
  
  btnExport.addEventListener('click', function () {
    const lines = finals.slice();
    if (interimText()) lines.push(interimText());
    if (!lines.length) return;

    const content = '\uFEFF' + lines.join('\r\n');
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = buildFileName('.txt');
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  btnExportAudio.addEventListener('click', function () {
    if (!audioBlobUrl) return;
    const a = document.createElement('a');
    a.href = audioBlobUrl;
    a.download = buildFileName('.webm');
    document.body.appendChild(a);
    a.click();
    a.remove();
  });

  /* ---------- Xóa dữ liệu cũ ---------- */
  btnClear.addEventListener('click', function () {
    if (!confirm('Xóa toàn bộ VĂN BẢN và ÂM THANH đã ghi?')) return;
    finals = [];
    clearInterim();
    box.innerHTML = '';
    globalStartTime = 0;
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    
    if (audioBlobUrl) {
      URL.revokeObjectURL(audioBlobUrl);
      audioBlobUrl = null;
      btnExportAudio.disabled = true;
    }
    
    renderEmptyHint();
    updateButtons();
  });

  window.addEventListener('pagehide', function () {
    const left = interimText();
    if (left) { finals.push(left); save(); }
  });
})();
</script>
</body>
</html>
